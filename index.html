<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVENTÁRIO SZ005</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#eef2f7;color:#172033;margin:0;padding:15px}
main{max-width:700px;margin:auto}
.card{background:white;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}
h1{color:#1457a6;text-align:center}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#1457a6;color:white;border:0;font-weight:bold}
.item{padding:12px;border-bottom:1px solid #ddd;cursor:pointer}
.small{color:#64748b;font-size:13px}
#app{display:none}
</style>
</head>
<body>
<main>
<h1>INVENTÁRIO SZ005</h1>

<div class="card">
<h3>Conexão Supabase</h3>
<input id="url" placeholder="Project URL">
<input id="key" placeholder="Publishable key">
<button onclick="conectar()">Conectar</button>
<p id="status" class="small"></p>
</div>

<div class="card" id="login">
<h3>Login do funcionário</h3>
<input id="email" type="email" placeholder="E-mail">
<input id="senha" type="password" placeholder="Senha">
<button onclick="entrar()">Entrar</button>
<p id="loginStatus"></p>
</div>

<div id="app">
<div class="card">
<p id="usuario"></p>
<button onclick="sair()">Sair</button>
</div>

<div class="card" id="painelAdmin" style="display:none">
  <h2>PAINEL DO ADMINISTRADOR</h2>
  <p>Visão geral das contagens dos funcionários</p>
  <button onclick="carregarPainelAdmin()">Atualizar contagens</button>
  <div id="resumoAdmin"></div>
</div>
 
<div class="card">
<h3>Registrar contagem física</h3>
<h4>Escolha um produto da lista</h4>
<input id="busca" placeholder="Filtrar produtos (opcional)" oninput="buscar()">
<div id="resultados"></div>
<button onclick="mostrarTodos()">Ver todos os produtos</button>
<p id="selecionado"></p>
<input id="quantidade" type="number" min="0" step="any" placeholder="Quantidade contada">
<input id="observacao" placeholder="Observação (opcional)">
<button onclick="salvarContagem()">Salvar contagem</button>
<p id="mensagem"></p>
</div>
  <div class="card">
<h3>📦 VENDAS PENDENTES DE SEPARAÇÃO</h3>
<input id="buscarPedido" placeholder="Buscar número do pedido ou código">
<button onclick="carregarVendasPendentes()">Atualizar pedidos</button>
<div id="listaVendasPendentes"></div>
  </div>

<div class="card">
<h3>Minhas últimas contagens</h3>
<button onclick="historico()">Atualizar histórico</button>
<div id="historico"></div>
</div>
</div>
</main>

<script>
let db=null, produtos=[], produtoEscolhido=null, usuarioAtual=null;

function conectar(){
 try {
  const url=document.getElementById('url').value.trim();
  const key=document.getElementById('key').value.trim();

  if(!url||!key){
   alert('Preencha a URL e a chave publicável.');
   return;
  }

  if(typeof supabase==='undefined'){
   throw new Error('Biblioteca Supabase não carregou.');
  }

  db=supabase.createClient(url,key);

  localStorage.setItem('sz_url',url);
  localStorage.setItem('sz_key',key);

  document.getElementById('status').textContent='Conexão configurada!';
  alert('Conexão configurada com sucesso!');
 } catch(e) {
  alert('Erro na conexão: '+e.message);
 }
}
async function entrar(){
 if(!db){alert('Configure a conexão primeiro.');return;}
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('senha').value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){document.getElementById('loginStatus').textContent=error.message;return;}
 usuarioAtual=data.user;
 
const {data:perfil,error:erroPerfil}=await db
 .from('profiles')
 .select('full_name,role')
 .eq('id',data.user.id)
 .maybeSingle();

if(erroPerfil){
 alert('Erro ao consultar perfil: '+erroPerfil.message);
 return;
}

if(perfil?.role==='admin'){
 document.getElementById('painelAdmin').style.display='block';
}else{
 document.getElementById('painelAdmin').style.display='none';
}
 
 document.getElementById('login').style.display='none';
 document.getElementById('app').style.display='block';
 document.getElementById('usuario').textContent='Funcionário: '+data.user.email;
 await carregarProdutos();
 await historico();
}

async function carregarProdutos(){
 const {data,error}=await db.from('products')
 .select('id,code,description,system_quantity')
 .eq('active',true).order('code');
 if(error){alert('Erro ao carregar produtos: '+error.message);return;}
 produtos=data||[];
 document.getElementById('mensagem').textContent=produtos.length+' produtos carregados.';
}

function escapar(valor){
 return String(valor??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function buscar(){
 const termo=document.getElementById('busca').value.toLowerCase().trim();
 const lista=document.getElementById('resultados');
 produtoEscolhido=null;
 document.getElementById('selecionado').textContent='';
 if(!termo){lista.innerHTML='';return;}
 const encontrados=produtos.filter(p=>
 String(p.code).toLowerCase().includes(termo)||
 String(p.description).toLowerCase().includes(termo)
 ).slice(0,30);
 lista.innerHTML=encontrados.map((p,i)=>
 `<div class="item" onclick="selecionarProduto(${Number(p.id)})">
 <b>${escapar(p.code)}</b> - ${escapar(p.description)}
 <div class="small">Saldo do sistema: ${escapar(p.system_quantity)}</div>
 </div>`).join('');
 if(!encontrados.length)lista.textContent='Nenhum produto encontrado.';
}
function mostrarTodos(){
 const lista=document.getElementById('resultados');
 const termo=document.getElementById('busca').value.toLowerCase().trim();

 const encontrados=produtos.filter(p=>
 String(p.code).toLowerCase().includes(termo) ||
 String(p.description).toLowerCase().includes(termo)
 );

 lista.innerHTML=encontrados.map(p=>
 `<div class="item" onclick="selecionarProduto(${Number(p.id)})">
 <b>${escapar(p.code)}</b> - ${escapar(p.description)}
 <div class="small">Saldo do sistema: ${escapar(p.system_quantity)}</div>
 </div>`
 ).join('');

 if(!encontrados.length){
 lista.textContent='Nenhum produto encontrado.';
 }
}
function selecionarProduto(id){
 produtoEscolhido=produtos.find(p=>Number(p.id)===id);
 if(!produtoEscolhido)return;
 document.getElementById('selecionado').textContent=
 'Selecionado: '+produtoEscolhido.code+' - '+produtoEscolhido.description+
 ' | Saldo sistema: '+produtoEscolhido.system_quantity;
 document.getElementById('resultados').innerHTML='';
}

async function salvarContagem(){
 if(!produtoEscolhido){alert('Escolha um produto primeiro.');return;}
 const campo=document.getElementById('quantidade');
 if(campo.value===''||Number(campo.value)<0){alert('Informe uma quantidade válida.');return;}
 const registro={
 product_id:produtoEscolhido.id,
 user_id:usuarioAtual.id,
 counted_qty:Number(campo.value),
 note:document.getElementById('observacao').value.trim()||null
 };
 const {error}=await db.from('count_entries').insert(registro);
 if(error){alert('Não foi possível salvar: '+error.message);return;}
 document.getElementById('mensagem').textContent='Contagem salva com sucesso!';
 campo.value='';
 document.getElementById('observacao').value='';
 document.getElementById('busca').value='';
 document.getElementById('selecionado').textContent='';
 document.getElementById('resultados').innerHTML='';
 produtoEscolhido=null;
 await historico();
}


async function historico(){
 const area=document.getElementById('historico');

 const {data,error}=await db.from('count_entries')
 .select('id,product_id,counted_qty,note,created_at,products(code,description)')
 .eq('user_id',usuarioAtual.id)
 .order('created_at',{ascending:false});

 if(error){
  area.textContent='Erro: '+error.message;
  return;
 }

 if(!data.length){
  area.textContent='Nenhuma contagem registrada.';
  return;
 }

 const grupos={};

 data.forEach(c=>{
  const id=c.product_id;

  if(!grupos[id]){
   grupos[id]={
    code:c.products?.code||'',
    description:c.products?.description||'',
    total:0,
    passagens:[]
   };
  }

  grupos[id].total+=Number(c.counted_qty);
  grupos[id].passagens.push(c);
 });

 area.innerHTML=Object.values(grupos).map(p=>`
  <div class="item">
   <b>${escapar(p.code)}</b> - ${escapar(p.description)}
   <br><b>Total acumulado: ${p.total}</b>
   <br><span class="small">${p.passagens.length} passagem(ns)</span>
   ${p.passagens.map(c=>`
    <div style="border-top:1px solid #ccc;margin-top:8px;padding-top:8px">
     Quantidade: <b>${c.counted_qty}</b>
     <br><span class="small">${new Date(c.created_at).toLocaleString('pt-BR')}</span>
     <br>
     <button onclick="editarContagem(${c.id},${Number(c.counted_qty)})">Editar</button>
     <button onclick="excluirContagem(${c.id})">Excluir</button>
    </div>
   `).join('')}
  </div>
 `).join('');
}

async function editarContagem(id,quantidadeAtual){
 const nova=prompt('Digite a nova quantidade:',quantidadeAtual);

 if(nova===null)return;

 if(nova.trim()==='' || !Number.isFinite(Number(nova)) || Number(nova)<0){
  alert('Digite uma quantidade válida.');
  return;
 }

 const {error}=await db.from('count_entries')
 .update({counted_qty:Number(nova)})
 .eq('id',id)
 .eq('user_id',usuarioAtual.id);

 if(error){
  alert('Erro ao editar: '+error.message);
  return;
 }

 alert('Contagem atualizada!');
 await historico();
}

async function excluirContagem(id){
 if(!confirm('Deseja realmente excluir esta passagem?'))return;

 const {error}=await db.from('count_entries')
 .delete()
 .eq('id',id)
 .eq('user_id',usuarioAtual.id);

 if(error){
  alert('Erro ao excluir: '+error.message);
  return;
 }

 alert('Passagem excluída!');
 await historico();
}
 

async function carregarPainelAdmin(){
 const area=document.getElementById('resumoAdmin');
 area.textContent='Carregando contagens...';

 const {data:contagens,error}=await db
  .from('count_entries')
  .select('id,user_id,product_id,counted_qty,created_at,products(code,description,system_quantity)')
  .order('created_at',{ascending:false});

 if(error){
  area.textContent='Erro ao carregar contagens: '+error.message;
  return;
 }

 const {data:perfis,error:erroPerfis}=await db
  .from('profiles')
  .select('id,full_name');

 if(erroPerfis){
  area.textContent='Erro ao carregar funcionários: '+erroPerfis.message;
  return;
 }

 const {data:aprovacoes,error:erroAprovacoes}=await db
  .from('product_reviews')
  .select('product_id,approved_qty,approved_by,approved_at');

 if(erroAprovacoes){
  area.textContent='Erro ao carregar aprovações: '+erroAprovacoes.message;
  return;
 }

 const nomes={};
 (perfis||[]).forEach(p=>{
  nomes[p.id]=p.full_name||'Nome não cadastrado';
 });

 const aprovadas={};
 (aprovacoes||[]).forEach(a=>{
  aprovadas[a.product_id]=a;
 });

 if(!contagens?.length){
  area.textContent='Nenhuma contagem registrada.';
  return;
 }

 const grupos={};

 contagens.forEach(c=>{
  const id=c.product_id;

  if(!grupos[id]){
   grupos[id]={
    id:id,
    code:c.products?.code||'',
    description:c.products?.description||'',
    system:Number(c.products?.system_quantity||0),
    total:0,
    passagens:[]
   };
  }

  grupos[id].total+=Number(c.counted_qty);
  grupos[id].passagens.push(c);
 });

 area.innerHTML=Object.values(grupos).map(p=>{
  const diferenca=p.total-p.system;
  const aprovacao=aprovadas[p.id];

  return `<div class="item">
   <b>${escapar(p.code)}</b> - ${escapar(p.description)}
   <br>Saldo Infor: <b>${p.system}</b>
   <br>Total contado: <b>${p.total}</b>
   <br>Diferença: <b>${diferenca}</b>
   <br>Saldo oficial aprovado:
   <b>${aprovacao?aprovacao.approved_qty:'Ainda não aprovado'}</b>
   <br>
   ${aprovacao
    ? `<b>PRODUTO APROVADO</b>
       <br>Por: ${escapar(nomes[aprovacao.approved_by]||'Administrador')}
       <br>Data: ${new Date(aprovacao.approved_at).toLocaleString('pt-BR')}`
    : '<b>PENDENTE DE APROVAÇÃO</b>'}
   <br>
   <button onclick="aprovarProduto(${Number(p.id)},${p.total})">
    ${aprovacao?'Atualizar aprovação':'Aprovar quantidade'}
   </button>
   <br><br>
   Passagens: ${p.passagens.length}
   ${p.passagens.map(c=>`
    <div style="border-top:1px solid #ccc;margin-top:8px;padding-top:8px">
     Funcionário: <b>${escapar(nomes[c.user_id]||'Não identificado')}</b>
     <br>Quantidade: ${Number(c.counted_qty)}
     <br>Data: ${new Date(c.created_at).toLocaleString('pt-BR')}
    </div>
   `).join('')}
  </div>`;
}).join('');
  
}
async function aprovarProduto(productId,quantidade){
 if(!confirm('Confirmar aprovação da quantidade total de '+quantidade+' unidades?'))return;

 const {error}=await db
  .from('product_reviews')
  .upsert({
   product_id:productId,
   approved_qty:quantidade,
   approved_by:usuarioAtual.id,
   approved_at:new Date().toISOString()
  },{onConflict:'product_id'});

 if(error){
  alert('Erro ao aprovar: '+error.message);
  return;
 }

 alert('Quantidade aprovada com sucesso!');
 await carregarPainelAdmin();
}
  
 

async function sair(){
 if(db)await db.auth.signOut();
 usuarioAtual=null;
 document.getElementById('app').style.display='none';
 document.getElementById('login').style.display='block';
 document.getElementById('senha').value='';
}
async function carregarVendasPendentes(){
 const lista=document.getElementById('listaVendasPendentes');
 lista.innerHTML='Carregando pedidos...';

 const {data,error}=await db
  .from('pending_sales')
  .select('*')
  .order('created_at',{ascending:false});

 if(error){
  lista.innerHTML='Erro: '+error.message;
  return;
 }

 const busca=document.getElementById('buscarPedido').value.toLowerCase();

 const vendas=data.filter(v=>
  (v.order_number||'').toLowerCase().includes(busca) ||
  (v.product_code||'').toLowerCase().includes(busca)
 );

 if(!vendas.length){
  lista.innerHTML='Nenhuma venda pendente encontrada.';
  return;
 }

 lista.innerHTML=vendas.map(v=>{
  const status=v.status||'aguardando';

  const cores={
   aguardando:'#ffffff',
   iniciada:'#ffcc33',
   finalizada:'#32b768'
  };

  const textos={
   aguardando:'AGUARDANDO SEPARAÇÃO',
   iniciada:'SEPARAÇÃO INICIADA',
   finalizada:'SEPARAÇÃO FINALIZADA'
  };

  let tempo='';
  if(v.started_at){
   const inicio=new Date(v.started_at);
   const fim=v.finished_at?new Date(v.finished_at):new Date();
   const minutos=Math.floor((fim-inicio)/60000);
   tempo=`${minutos} minuto(s)`;
  }

  return `
   <div class="item" style="border:1px solid #ccc;padding:12px;margin:10px 0;border-radius:8px">
    <b>Pedido:</b> ${v.order_number||''}<br>
    <b>Código:</b> ${v.product_code||''}<br>
    <b>Produto:</b> ${v.description||''}<br>
    <b>Quantidade:</b> ${v.quantity||0}<br>
    <b>Separador:</b> ${v.picker_name||'Não definido'}<br>
    <b>Tempo:</b> ${tempo||'Não iniciado'}<br>
    <button style="background:${cores[status]};color:#222;font-weight:bold"
     onclick="avancarSeparacao(${v.id},'${status}')">
     ${textos[status]||textos.aguardando}
    </button>
   </div>`;
 }).join('');
}

async function avancarSeparacao(id,status){
 if(status==='pendente'){
  const nome=prompt('Digite o nome do separador:');
  if(!nome||!nome.trim())return;

  const {error}=await db.from('pending_sales').update({
   status:'separando',
   picker_name:nome.trim(),
   started_at:new Date().toISOString()
  }).eq('id',id);

  if(error){alert('Erro ao iniciar: '+error.message);return;}
 }

 else if(status==='separando'){
  if(!confirm('Finalizar esta separação?'))return;

  const {error}=await db.from('pending_sales').update({
   status:'separado',
   finished_at:new Date().toISOString()
  }).eq('id',id);

  if(error){alert('Erro ao finalizar: '+error.message);return;}
 }

 await carregarVendasPendentes();
}
window.addEventListener('load',()=>{
 const url=localStorage.getItem('sz_url');
 const key=localStorage.getItem('sz_key');
 if(url)document.getElementById('url').value=url;
 if(key)document.getElementById('key').value=key;
});
</script>
</body>
</html>
