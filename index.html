<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVENTÁRIO SZ005</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:20px;color:#172033}
main{max-width:700px;margin:auto}
.card{background:white;padding:20px;border-radius:12px;margin:15px 0}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:7px;border:1px solid #ccc}
button{background:#1457a6;color:white;border:0;font-weight:bold}
h1{color:#1457a6}
</style>
</head>
<body>
<main>
<h1>INVENTÁRIO SZ005</h1>
<div class="card">
<h3>Configuração Supabase</h3>
<input id="url" placeholder="Project URL">
<input id="key" placeholder="Publishable key">
<button onclick="conectar()">Conectar</button>
<p id="status"></p>
</div>
<div class="card">
<h3>Login do funcionário</h3>
<input id="email" type="email" placeholder="E-mail">
<input id="senha" type="password" placeholder="Senha">
<button onclick="entrar()">Entrar</button>
<button onclick="sair()">Sair</button>
<p id="usuario"></p>
</div>
<div class="card">
<h3>Produtos cadastrados</h3>
<button onclick="carregar()">Carregar produtos</button>
<p id="total">Aguardando conexão...</p>
<div id="produtos"></div>
</div>
</main>
<script>
let db=null;

function conectar(){
 const url=document.getElementById('url').value.trim();
 const key=document.getElementById('key').value.trim();
 if(!url||!key){alert('Preencha os dois campos');return;}
 db=supabase.createClient(url,key);
 localStorage.setItem('sz_url',url);
 localStorage.setItem('sz_key',key);
 document.getElementById('status').textContent='Conexão configurada. Faça login.';
}

async function entrar(){
 if(!db){alert('Configure o Supabase primeiro');return;}
 const email=document.getElementById('email').value;
 const senha=document.getElementById('senha').value;
 const {data,error}=await db.auth.signInWithPassword({email,password:senha});
 if(error){alert(error.message);return;}
 document.getElementById('usuario').textContent='Login realizado: '+data.user.email;
 carregar();
}

async function sair(){
 if(!db)return;
 await db.auth.signOut();
 document.getElementById('usuario').textContent='Sessão encerrada';
}

async function carregar(){
 if(!db){alert('Configure o Supabase primeiro');return;}
 const {data,error}=await db.from('products')
 .select('code,description,system_quantity')
 .eq('active',true).order('code');
 if(error){alert('Erro: '+error.message);return;}
 document.getElementById('total').textContent=data.length+' produtos carregados';
 document.getElementById('produtos').innerHTML=data.map(p=>
 '<p><b>'+p.code+'</b> - '+p.description+
 ' | Saldo: '+p.system_quantity+'</p>'
 ).join('');
}

window.addEventListener('load',()=>{
 const url=localStorage.getItem('sz_url');
 const key=localStorage.getItem('sz_key');
 if(url&&key){
 document.getElementById('url').value=url;
 document.getElementById('key').value=key;
 }
});
</script>
</body>
</html>
